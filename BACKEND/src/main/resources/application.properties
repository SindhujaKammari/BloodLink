# Application name
spring.application.name=blood_donor

# Load the local env file whether started from the repository or backend directory.
spring.config.import=optional:file:./.env[.properties],optional:file:./BACKEND/.env[.properties]

# MySQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080
